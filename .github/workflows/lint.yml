name: besic node ci
on:
  push:
    branches: main
  pull_request:
    branches: main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: code setup
        uses: actions/checkout@v6
      - name: node setup
        uses: actions/setup-node@v4
        with:
          node-versions: "22"
    
      

